name: Validate PR

on:
  pull_request:

jobs:
  android_validate_pr:
    runs-on: ubuntu-latest

    steps:
      # 1. clolone repository
      - name: Checkout code
        uses: actions/checkout@v4
        
      # 2. Java (Android build requirement)
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 3. Flutter (stable + cache)
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 4. Cache Gradle (faster builds 🚀)
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            gradle-${{ runner.os }}

      # 5. Ruby + Fastlane
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: android

      # 7. Run Fastlane lane
      - name: Run fastlane validate_pr (analyze, test, build apk)
        working-directory: android
        run: bundle exec fastlane validate_pr

