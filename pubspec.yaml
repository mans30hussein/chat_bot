name: chat_bot
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_svg: ^2.2.3
  font_awesome_flutter: ^10.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.7
  flutter_gen_runner: ^5.12.0
  build_runner: ^2.10.5

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf

flutter_gen:
  output: lib/core/gen/
  line_length: 80

flutter_native_splash:
  color: "#3369FF"
  image: assets/images/splash_logo.png
  android: true
  ios: true
  web: false
